<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MITORI ガイド操作確認</title><link rel="stylesheet" href="../guide.css">
<body><h1>ガイド単独の操作確認</h1><p>このページは本体データを読み書きしません。</p>
<button id="guideHelpBtn">？ ガイドを開く</button><input aria-label="保持確認用の入力" placeholder="ガイドを操作しても残る入力"><p id="destination"></p><div id="mitoriGuideRoot"></div>
<button id="testCompletionFocus">最終チェックのフォーカス確認</button><output id="testCompletionResult" aria-live="polite"></output>
<script src="../guide-content.js"></script><script src="../guide-model.js"></script><script src="../guide-storage.js"></script><script src="../guide-app.js"></script><script src="../guide-view.js?test=review-focus-fix"></script>
<script>
const memory=new Map();const storage={getItem:k=>memory.get(k)||null,setItem:(k,v)=>memory.set(k,v)};
const store=MitoriGuideStorage.createGuideStore({storage});let controller;
const view=MitoriGuideView.createGuideView({document,window,root:document.getElementById('mitoriGuideRoot'),onAction:a=>controller.dispatch(a)});
controller=MitoriGuideApp.createGuideController({catalog:MitoriGuideContent.GUIDES,store,view,navigate:async target=>{document.getElementById('destination').textContent=JSON.stringify(target);return true;}});
document.getElementById('guideHelpBtn').onclick=()=>controller.dispatch({type:'menu'});controller.restore();
document.getElementById('testCompletionFocus').onclick=async()=>{
  await controller.dispatch({type:'open',guideId:'initial-setup'});await controller.dispatch({type:'start'});
  for(const step of MitoriGuideContent.GUIDES[0].steps.slice(0,-1))await controller.dispatch({type:'check',stepId:step.id,checked:true});
  const checkbox=document.getElementById('guide-check-lesson_board');checkbox.focus();checkbox.click();
  requestAnimationFrame(()=>requestAnimationFrame(()=>{
    document.getElementById('testCompletionResult').textContent=document.activeElement===checkbox&&checkbox.getClientRects().length?'PASS：最後のチェックとフォーカスを維持':'FAIL：最後のチェックまたはフォーカスが失われた';
  }));
};
</script></body></html>
